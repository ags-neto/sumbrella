; PlatformIO project for Projeto.ino, the DS3231 sketch that sits in the
; repository root. The ESP8266 sketch has its own project, because PlatformIO
; only converts a *.ino file that is at the top of its src_dir:
;
;   pio run                              -> Projeto.ino     (Arduino Nano)
;   pio run -d Fetch_rain                -> Fetch_rain.ino  (ESP8266 ESP-01)
;   ./run.sh                             -> both, then the offline tests
;
; Neither sketch names its board in its own source. The board is named on the
; course poster kept in this repository, Sumbrella.pdf, under "Listagem de
; material": "Arduino Nano" and "ESP8226 ESP-01" (sic). Projeto.ino agrees with
; the Nano: analogWrite() on pins 5 and 6, both PWM-capable, plus the SDA/SCL
; macros, which are A4/A5 = 18/19 on the Nano exactly as on the Uno.

[platformio]
src_dir = .

[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 9600
; src_dir is the repository root, so keep the ESP8266 sketch's own project
; directory (and the .pio tree PlatformIO creates inside it) out of this build.
build_src_filter = +<*> -<Fetch_rain/>
lib_deps =
    ; DS3231 1.01 — Rinky-Dink Electronics / Henning Karlsen. It is NOT in the
    ; PlatformIO registry (all 87 registry search hits were checked for the
    ; class Time / getTimeStr() / DS3231(data, sclk) API it needs), so it is
    ; pinned to a byte-identical mirror of the removed libs/DS3231 at tag v1.01.
    ; See DEPENDENCIAS.md.
    https://github.com/whonore/DS3231.git#v1.01

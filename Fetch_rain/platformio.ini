; PlatformIO project for Fetch_rain.ino (ESP8266).
; Build it from the repository root with: pio run -d Fetch_rain
;
; The board is named on the course poster kept in this repository,
; Sumbrella.pdf: "ESP8226 ESP-01" (sic) — an ESP-01, whose flash size the poster
; does not give. esp01 targets the 512 KB module, which is the variant the
; firmware fits either way; use board = esp01_1m for a 1 MB ESP-01.
;
; Fetch_rain.ino does not compile without secrets.h, which is not versioned:
;   cp Fetch_rain/secrets.h.example Fetch_rain/secrets.h

[platformio]
src_dir = .

[env:esp8266]
platform = espressif8266
board = esp01
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
